# Orchestrator dispatch declaration for the pulse v1 plan-writing scout task.
# This is NOT the pulse delivery plan; it declares the single scout phase that
# produces that plan. The plan-writer's output is the real plan instance.
# Validates against schemas/plan.schema.json.
kind: plan
status: approved
baseline-commit: c940e4d
binding-rule: >-
  If it is not written here, it is not being made. Unanswered questions go to
  the orchestrator.
process-summary: >-
  Orchestrated delivery under the full mode: verified plan, adversarial plan
  review, one phase per branch, dual clean-room review before merge, merge
  authority delegated under DR-0012's conditions.
standing-context: |
  Intake is complete at pulse commit c940e4d: charter, four intake documents
  under delivery/intake/, design reference, message catalogs, styles, and
  three project skills. The fleet home is initialized, doctor exits 0 under
  the full profile, the charter validates, and DR-0012 grants delegated merge
  authority. No product code exists yet; the Next.js app is not scaffolded.
report-code-disagreement: []
phases:
  - id: M0-P1
    branch: claude/m0-p1-plan-v1
    intent: >-
      Write the pulse v1 delivery plan from the intake documents, as a plan
      instance that validates against the kernel's plan schema.
    grounding: >-
      The intake documents at delivery/intake/ (pulse-v1-plan.md,
      pulse-v1-architecture.md, acceptance-criteria.md,
      tiphys-pilot-success.md) are the input report. The repository at
      c940e4d carries no product code, so the verification pass runs against
      what the repository actually contains rather than assumed scaffolding.
    severity: high
    verified-root-cause: >-
      Not a defect phase; the scout produces the delivery plan. The
      verification-first step exists because the intake documents make
      claims about repository content and stack behaviour that the plan may
      only build on after checking them against the tree at the baseline
      commit.
    steps:
      - kind: verification-first
        text: >-
          Verify every claim the intake documents make against the
          repository at the baseline commit, file and line, and record every
          disagreement in the plan's report-code-disagreement section before
          any phase is planned on it.
      - text: >-
          Write the delivery plan as delivery/plan/pulse-v1.yaml, phased into
          the slices the intake plan describes, every acceptance criterion
          falsifiable, hazard classes declared per phase, product questions
          flagged as decision records rather than decided.
      - text: >-
          Validate the plan against the kernel schema and fix every
          diagnostic: npx tiphys validate --type plan --context . must exit 0
          in the worktree.
    files-to-touch:
      - delivery/plan/pulse-v1.yaml
    extras: []
    acceptance:
      - id: "1"
        criterion: >-
          npx tiphys validate --type plan --context <worktree>
          delivery/plan/pulse-v1.yaml exits 0.
      - id: "2"
        criterion: >-
          The plan's report-code-disagreement section lists every intake
          claim checked, each with a file reference and a verified flag, and
          it is non-empty or the plan states in standing-context why no
          claim needed verification.
      - id: "3"
        criterion: >-
          Every phase carries at least one acceptance criterion that names a
          command and an exit code or an observable output; no criterion
          contains the words "works correctly".
      - id: "4"
        criterion: >-
          No product question is decided in the plan: each is flagged in
          open-questions with a decision-record id, and grep of the plan for
          those ids shows each one referenced by at least one phase slot.
      - id: "5"
        criterion: >-
          The intake documents under delivery/intake/ are byte-identical to
          the baseline commit: git diff c940e4d -- delivery/intake/ is
          empty.
    hazard-classes:
      - id: H1
        statement: >-
          The plan silently decides a product question the intake left open,
          burying an irreversible choice in a step.
        addressed-by: criterion 4
      - id: H2
        statement: >-
          The plan builds a phase on an intake claim that does not survive
          contact with the repository, planning work that does not exist.
        addressed-by: criterion 2
      - id: H3
        statement: >-
          The scout edits intake facts instead of recording disagreement,
          destroying the input report's evidentiary value.
        addressed-by: criterion 5
    migrations: none
    conflicts-with: []
    parallelizable: false
    citations:
      - R-005
      - R-010a
    fill-in:
      filled: false
      root-cause: ""
      fix-shape: ""
      files: []
decisions:
  - id: D-1
    statement: >-
      The plan is written by a dispatched plan-writer agent under the
      kernel's role brief, not by the orchestrator, because the orchestrator
      writing it would remove the independent reader every later review
      assumes (R-001b).
  - id: D-2
    statement: >-
      Kernel 0.1.0's spawn scrubs the child environment and ships no agent
      adapter (PR-013 defers it), so the plan-writer runs as a harness agent
      given the composed brief, with incremental output and a freshness
      watchdog armed at dispatch. Recorded in the fleet backlog as pilot
      tuition.
open-questions: []
parked:
  - item: Running the plan-writer through tiphys spawn with a real agent CLI.
    reason: >-
      The scrubbed child environment cannot authenticate an agent by design,
      and the agent adapter is deferred to a later kernel milestone; working
      around the scrub would defeat the credential isolation it exists for.
